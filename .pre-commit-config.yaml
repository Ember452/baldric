# Narrow local hooks: fast checks that catch the mistakes formatting and
# ratchets can see. Tests, coverage, and the full matrix belong to CI; keeping
# this file small is what makes running it before every commit realistic.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: suppression-ratchet
        name: suppression ratchet
        entry: uv run python scripts/check_suppressions.py
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
      - id: structure-ratchet
        name: structure ratchet
        entry: uv run python scripts/check_structure.py
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
      - id: agent-guidance-ratchet
        name: agent guidance ratchet
        entry: uv run python scripts/check_agent_guidance.py
        language: system
        pass_filenames: false
        files: (^AGENTS\.md$|^CLAUDE\.md$|/AGENTS\.md$|/CLAUDE\.md$)
      - id: version-consistency
        name: version consistency
        entry: uv run python scripts/verify_versions.py
        language: system
        pass_filenames: false
        files: (^pyproject\.toml$|^uv\.lock$)
