name: Bug report
description: Report behavior that is broken or surprising.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Remove secrets and private paths from logs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The observed behavior, including the exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Smallest steps or repository that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Baldric version
      placeholder: output of `baldric --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: OS, terminal, and Python version
    validations:
      required: true
