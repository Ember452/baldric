name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  python:
    permissions:
      contents: read
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run tests with coverage
        run: uv run pytest --cov

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

      - name: Check architecture layer direction
        run: uv run python scripts/check_import_graph.py

      - name: Check structure ratchet
        run: uv run python scripts/check_structure.py

      - name: Check suppression ratchet
        run: uv run python scripts/check_suppressions.py

      # A passing check that silently left files behind is not a passing check:
      # generated artifacts, formatter drift, or an edited baseline must be
      # committed (or reverted) before the run is meaningful.
      - name: Assert a clean worktree
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The worktree changed during CI; commit generated files or revert unintended edits."
            git status --porcelain
            exit 1
          fi

  # The package claims `requires-python = ">=3.12"`, so the range has to be
  # tested rather than assumed. Lint, format and mypy stay on the pinned version
  # above: they are tooling checks, and running them per interpreter would only
  # multiply cost while making type results depend on the runner's Python.
  # `fail-fast: false` so one unsupported version does not hide the others.
  #
  # The `--python` flags are load-bearing. `.python-version` pins 3.12, and
  # without an explicit request uv resolves the project environment for that
  # pin, turning the matrix into the same interpreter three times.
  pytest-matrix:
    permissions:
      contents: read
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies for this Python
        run: uv sync --dev --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  docs:
    permissions:
      contents: read
    name: Documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Build documentation and search index
        run: npm run build

      - name: Test website
        run: npm test

  # One required check instead of enumerating jobs in branch protection.
  #
  # `always()` is load-bearing: without it GitHub skips this job after a failed
  # dependency, and a required check can then appear successful instead of
  # reporting the failure. `skipped` counts as failure here for the same reason:
  # a skipped job is not a green job.
  all-checks-passed:
    permissions: {}
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [python, pytest-matrix, docs]
    if: ${{ always() }}
    steps:
      - name: Report dependency results
        run: |
          echo "python:        ${{ needs.python.result }}"
          echo "pytest-matrix: ${{ needs.pytest-matrix.result }}"
          echo "docs:          ${{ needs.docs.result }}"

      - name: Fail when any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A required job failed, was cancelled, or was skipped."
          exit 1

      - name: Confirm success
        run: echo "All required jobs succeeded."
