name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Static checks are fast (~90s) and independent of the test suite, so they run
  # in their own job: a lint or type error is reported in well under two minutes
  # instead of waiting behind a five-minute pytest run.
  static:
    permissions:
      contents: read
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

      - name: Check architecture layer direction
        run: uv run python scripts/check_import_graph.py

      - name: Check structure ratchet
        run: uv run python scripts/check_structure.py

      - name: Check suppression ratchet
        run: uv run python scripts/check_suppressions.py

      - name: Check agent-guidance ratchet
        run: uv run python scripts/check_agent_guidance.py

      - name: Check changelog is current
        run: uv run python scripts/render_changelog.py --check

      - name: Check version consistency
        run: uv run python scripts/verify_versions.py

      # A passing check that silently left files behind is not a passing check:
      # generated artifacts, formatter drift, or an edited baseline must be
      # committed (or reverted) before the run is meaningful.
      - name: Assert a clean worktree
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The worktree changed during CI; commit generated files or revert unintended edits."
            git status --porcelain
            exit 1
          fi

  tests:
    permissions:
      contents: read
    name: Tests with coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run tests with coverage
        run: uv run pytest --cov

      - name: Assert a clean worktree
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The worktree changed during CI; commit generated files or revert unintended edits."
            git status --porcelain
            exit 1
          fi

  # The package claims `requires-python = ">=3.12"`, so the range has to be
  # tested rather than assumed. Lint, format and mypy stay on the pinned version
  # above: they are tooling checks, and running them per interpreter would only
  # multiply cost while making type results depend on the runner's Python.
  # `fail-fast: false` so one unsupported version does not hide the others.
  #
  # The `--python` flags are load-bearing. `.python-version` pins 3.12, and
  # without an explicit request uv resolves the project environment for that
  # pin, turning the matrix into the same interpreter three times.
  pytest-matrix:
    permissions:
      contents: read
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies for this Python
        run: uv sync --dev --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  # Collecting every test without running it catches import errors and missing
  # optional dependencies in a clean install, which a partially-cached local
  # environment can hide.
  collection-gate:
    permissions:
      contents: read
    name: Test collection
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Collect every test
        run: uv run pytest --collect-only -q

  docs:
    permissions:
      contents: read
    name: Documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Build documentation and search index
        run: npm run build

      - name: Test website
        run: npm test

  # Windows-only regressions cannot be seen from a Linux runner: text-mode
  # stdout writes CRLF, stdin decodes through the system code page, and path
  # handling differs. This job runs the deterministic core domains on Windows so
  # those regressions surface in CI instead of on the maintainer's machine.
  #
  # The Textual TUI is deliberately excluded. TUI tests hang intermittently in
  # the Windows asyncio backend (a known limitation documented in AGENTS.md);
  # including them would make this job flaky and end up ignored.
  windows-smoke:
    permissions:
      contents: read
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run core domains
        run: >
          uv run pytest
          tests/agent tests/ai tests/guards tests/invariants
          tests/runtime/commands tests/runtime/cli tests/runtime/providers

  # One required check instead of enumerating jobs in branch protection.
  #
  # `always()` is load-bearing: without it GitHub skips this job after a failed
  # dependency, and a required check can then appear successful instead of
  # reporting the failure. `skipped` counts as failure here for the same reason:
  # a skipped job is not a green job.
  all-checks-passed:
    permissions: {}
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [static, tests, pytest-matrix, collection-gate, docs, windows-smoke]
    if: ${{ always() }}
    steps:
      - name: Report dependency results
        run: |
          echo "static:          ${{ needs.static.result }}"
          echo "tests:           ${{ needs.tests.result }}"
          echo "pytest-matrix:   ${{ needs.pytest-matrix.result }}"
          echo "collection-gate: ${{ needs.collection-gate.result }}"
          echo "docs:            ${{ needs.docs.result }}"
          echo "windows-smoke:   ${{ needs.windows-smoke.result }}"

      - name: Fail when any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A required job failed, was cancelled, or was skipped."
          exit 1

      - name: Confirm success
        run: echo "All required jobs succeeded."
