[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "baldric"
version = "0.3.0"
description = "A Python coding-agent harness in the pi→tau lineage. Forked from tau (huggingface/tau, MIT, © Alejandro AO)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "mcp>=1.0,<2",
    "packaging>=24.0",
    "pillow>=11.0",
    "pydantic>=2.11",
    "pygments>=2.18",
    "rich>=13.0",
    "textual>=8.2.8",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Ember452/baldric"
Documentation = "https://github.com/Ember452/baldric"
Repository = "https://github.com/Ember452/baldric"
Issues = "https://github.com/Ember452/baldric/issues"

[project.scripts]
baldric = "baldric.runtime.cli:app"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyte>=0.8.2",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.5",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/baldric/runtime/data/*"]

[tool.coverage.report]
# Ratchet floor: CI fails below this line. The committed value is deliberately
# below what the Linux CI suite achieves, because Windows runs skip the
# POSIX-only tests; tighten it whenever coverage grows.
fail_under = 80
show_missing = false
precision = 1

[tool.hatch.build.targets.wheel]
packages = ["src/baldric"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# RUF100 keeps the suppression ratchet honest: a `# noqa` for a rule that is not
# enabled (or that does not fire on that line) suppresses nothing, so counting it
# inflates the ratchet with directives that cannot ever be "used".
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["baldric"]

[[tool.mypy.overrides]]
module = "pygments.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The thread method is the only one that works on Windows, and it dumps all
# thread stacks on timeout — a hung TUI test fails loudly instead of hanging.
addopts = "-ra --timeout=120 --timeout-method=thread"
pythonpath = ["."]
